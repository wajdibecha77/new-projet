:contentReference[oaicite:0]{index=0}
<div class="row">
  <div class="col-lg-12 col-xl-12">
    <div class="card mb-30">
      <div class="card-body">

        <div class="card-header mb-4">
          <div class="d-flex justify-content-between">
            <h5 class="card-title">Listing Interventions</h5>
            <button class="btn btn-primary" routerLink="/create-intervention">
              Ajouter une intervention
            </button>
          </div>
        </div>

        <!-- FILTER -->
        <div class="row border-bottom mb-4">
          <div class="col-lg-3 mb-4">
            <input class="form-control" placeholder="Nom d'utilisateur" [(ngModel)]="filter.createdBy" />
          </div>

          <div class="col-lg-3 mb-4">
            <input class="form-control" placeholder="lieu" [(ngModel)]="filter.lieu" />
          </div>

          <div class="col-lg-3 mb-4">
            <select class="form-control" [(ngModel)]="filter.name">
              <option value="">Tous</option>
              <option value="Electrique">Electrique</option>
              <option value="Mecanique">Mecanique</option>
              <option value="Informatique">Informatique</option>
              <option value="Plomberie & chaud froid">Plomberie</option>
            </select>
          </div>

          <div class="col-lg-3 mb-4">
            <select class="form-control" [(ngModel)]="filter.etat">
              <option value="">Tous</option>
              <option value="NON_AFFECTEE">Non affectée</option>
              <option value="ASSIGNEE">Assignée</option>
              <option value="EN_COURS">En cours</option>
              <option value="TERMINEE">Terminée</option>
            </select>
          </div>
        </div>

        <!-- TABLE -->
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>#</th>
                <th>Type</th>
                <th>Lieu</th>
                <th>Etat</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let intervention of interventions; let i = index; trackBy: trackByInterventionId">

                <td>{{ i + 1 }}</td>
                <td>{{ intervention.name }}</td>
                <td>{{ intervention.lieu }}</td>

                <!-- STATUS -->
                <td>
                  <span *ngIf="intervention.etat === 'ASSIGNEE'" class="badge bg-primary">Assignée</span>
                  <span *ngIf="intervention.etat === 'EN_COURS'" class="badge bg-warning text-dark">En cours</span>
                  <span *ngIf="intervention.etat === 'TERMINEE'" class="badge bg-success">Terminée</span>
                  <span *ngIf="intervention.etat === 'NON_AFFECTEE'" class="badge bg-danger">Non affectée</span>
                </td>

                <!-- ACTION -->
                <td>
                  <button
                    *ngIf="intervention.etat === 'NON_AFFECTEE' || intervention.etat === 'ASSIGNEE'"
                    class="btn btn-sm btn-primary"
                    (click)="openAffectationModal(intervention)"
                  >
                    {{ intervention.etat === 'ASSIGNEE' ? 'Changer technicien' : 'Affecter' }}
                  </button>
                </td>

              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- ================= MODAL UNIQUE ================= -->

<div class="custom-backdrop" *ngIf="showModal"></div>

<div class="custom-modal" *ngIf="showModal">
  <div class="modal-box">

    <div class="modal-header">
      <h5>Affecter un technicien</h5>
      <button (click)="closeModal()">X</button>
    </div>

    <div *ngIf="isLoadingUsers" class="text-center p-3">
      Chargement...
    </div>

    <div *ngFor="let user of activeTechnicians; trackBy: trackByUserId"
         class="res-content"
         [class.selected-user]="selectedUser?._id === user._id"
         (click)="selectUser(user)">
      {{ user.name }}
    </div>

    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-danger w-50" (click)="closeModal()">Annuler</button>

      <button class="btn btn-primary w-50"
              [disabled]="!selectedUser || isSubmitting"
              (click)="confirmAffectation()">
        {{ isSubmitting ? '...' : 'Enregistrer' }}
      </button>
    </div>

  </div>
</div>
