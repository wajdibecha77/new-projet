<button class="chat-fab" type="button" (click)="toggleChat()" aria-label="Ouvrir chatbot">
  <span class="chat-fab-icon">IA</span>
  <span class="chat-fab-label">Chatbot IA</span>
</button>

<div class="chat-overlay" [class.open]="isOpen" (click)="closeChat()">
  <div class="chat-modal" (click)="$event.stopPropagation()">
    <div class="chat-modal-header">
      <span class="chat-modal-title">Chatbot IA</span>
      <button type="button" class="chat-modal-close" (click)="closeChat()" aria-label="Fermer">x</button>
    </div>

    <div class="chat-modal-body chatbot-messages" #messagesContainer>
      <div
        class="bubble"
        *ngFor="let message of messages"
        [class.user]="message.from === 'user'"
        [class.bot]="message.from === 'bot'"
        [class.typing]="message.typing"
      >
        {{ message.text }}
      </div>
    </div>

    <div class="chat-modal-input">
      <input
        type="text"
        [(ngModel)]="input"
        placeholder="Tapez votre question..."
        (keydown.enter)="onEnter($event)"
      />
      <button type="button" (click)="send()" [disabled]="loading">&gt;</button>
    </div>
  </div>
</div>
